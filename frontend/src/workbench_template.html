<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab-bench workbench — section rail | case form | live WHO-HAEM5 panel; stacks on phones.
   Palette drawn from a Romanowsky-stained film: azure-violet nuclei on a pale eosin-tinted ground. */
:root{
  --bg:#f6f4f7; --surface:#ffffff; --sunken:#efecf2; --line:#dcd6e2; --fg:#1d1a24; --muted:#615a6d;
  --accent:#5b3fa0; --accent-soft:#ece6f8; --eosin:#b8456a; --eosin-soft:#f8e7ee;
  --ok:#1f7a4d; --ok-soft:#e2f3ea; --warn:#9a6400; --warn-soft:#fbf0d9; --info:#2f5f8f; --info-soft:#e3edf7;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:8px; --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141219; --surface:#1d1a24; --sunken:#17151d; --line:#352f40; --fg:#ece8f2; --muted:#a59db3;
  --accent:#b39cf0; --accent-soft:#2a2340; --eosin:#f08bab; --eosin-soft:#3a1f2a;
  --ok:#6fd3a0; --ok-soft:#173326; --warn:#f0c060; --warn-soft:#3a2d12; --info:#8dbcef; --info-soft:#18283a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141219; --surface:#1d1a24; --sunken:#17151d; --line:#352f40; --fg:#ece8f2; --muted:#a59db3;
  --accent:#b39cf0; --accent-soft:#2a2340; --eosin:#f08bab; --eosin-soft:#3a1f2a;
  --ok:#6fd3a0; --ok-soft:#173326; --warn:#f0c060; --warn-soft:#3a2d12; --info:#8dbcef; --info-soft:#18283a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;padding-block:10px;max-width:1500px;margin:0 auto}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto;min-width:0}
.brand b{font:600 22px/1.1 var(--f-display);letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:4px 9px;font-size:13px}
.layout{display:grid;grid-template-columns:200px minmax(0,1fr) 380px;gap:var(--s5);max-width:1500px;margin:0 auto;padding-block:var(--s5)}
#printView{display:none}
@media print{body.printing>*:not(#printView){display:none!important}body.printing #printView{display:block;font:11pt/1.45 Georgia,serif;color:#000;background:#fff;padding:0}
#printView .lh{border-bottom:2px solid #000;margin-bottom:10px;padding-bottom:6px}#printView .lab{font-size:16pt;font-weight:700}#printView .sub{font-size:10pt}
#printView h3{font-size:11pt;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #999}#printView p{margin:2px 0}
#printView .crit{font-weight:700;border:1px solid #000;padding:3px 6px}#printView .fl{font-weight:700}#printView .foot{margin-top:18px;border-top:1px solid #999;padding-top:6px;font-size:9pt}
@page{margin:16mm}}
.importbox textarea{width:100%;font:13px var(--f-mono);margin:6px 0}
.flagb{margin-left:6px;font:11px var(--f-mono);color:var(--muted);white-space:nowrap}.flagb.ab{color:var(--warn);font-weight:700}.flagb.crit{color:var(--eosin);font-weight:700}.rtable{border-collapse:collapse;margin:8px 0;font-size:13px}.rtable td,.rtable th{padding:3px 6px;border-bottom:1px solid var(--line);text-align:left}
.pbar{position:relative;display:inline-block;width:150px;height:18px;margin:2px 8px 2px 0;border:1px solid var(--line);border-radius:9px;overflow:hidden;vertical-align:middle;background:var(--sunken)}.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft)}.pbar span{position:relative;z-index:1;font-size:11px;padding:0 8px;line-height:18px}
.rbcthumbs{display:flex;flex-wrap:wrap;gap:2px;margin:2px 0 8px}
.rbcalerts{margin:0 0 10px}.rbcalerts .fam{margin-bottom:4px}.warnbox.urgent{border:1px solid var(--eosin);background:var(--eosin-soft);font-weight:600}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:2px}
nav.rail button{text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--muted);display:flex;gap:8px;align-items:baseline}
nav.rail button .n{font:12px var(--f-mono);color:var(--muted);min-width:1.6em}
nav.rail button.on{background:var(--accent-soft);color:var(--fg);font-weight:600}
nav.rail button.on .n{color:var(--accent)}
main{min-width:0}
section.pane{display:none}
section.pane.on{display:block}
h2{font:600 26px/1.2 var(--f-display);margin:0 0 4px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 var(--s4);max-width:68ch}
fieldset{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:0 0 var(--s4);padding:var(--s4)}
legend{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:var(--s3) var(--s4)}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:13px;font-weight:500}
.f .u{font:12px var(--f-mono);color:var(--muted)}
.f input[type=number],.f input[type=text],.f select,.f textarea{border:1px solid var(--line);background:var(--sunken);border-radius:6px;padding:6px 8px;width:100%;min-width:0}
.f input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.f textarea{min-height:64px;resize:vertical}
.f.wide{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer;padding:3px 0}
.chk input{margin-top:3px;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;background:var(--sunken);user-select:none}
.chip input{accent-color:var(--accent);margin:0}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.chip.mono{font-family:var(--f-mono);font-size:12.5px}
/* live panel */
aside.live{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;display:flex;flex-direction:column;gap:var(--s3)}
.panelhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panelhead h3{font:600 19px var(--f-display);margin:0}
.panelhead span{font-size:12px;color:var(--muted)}
.cand{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:var(--s3);display:flex;flex-direction:column;gap:6px}
.cand.top{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cand .fam{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cand .ent{font-weight:600;line-height:1.3}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.met{background:var(--ok-soft);color:var(--ok)}
.pill.prob{background:var(--warn-soft);color:var(--warn)}
.pill.cons{background:var(--info-soft);color:var(--info)}
.cand ul{margin:0;padding-left:18px;font-size:13px}
.cand ul.miss li{color:var(--warn)}
.cand .notes{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.warnbox{background:var(--warn-soft);color:var(--fg);border-radius:var(--r);padding:var(--s3);font-size:13px;border:1px solid var(--line)}
.disclaim{font-size:12px;color:var(--muted);border-left:3px solid var(--eosin);padding-left:10px}
/* counter */
.cnt-top{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center;margin-bottom:var(--s3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--accent);color:var(--surface)}
.total{font:600 28px var(--f-mono);font-variant-numeric:tabular-nums}
.total small{font:13px var(--f-body);color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.key{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:baseline;text-align:left}
.key:active{transform:translateY(1px)}
.key .kb{font:600 11px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);grid-row:span 2}
.key .nm{font-size:13.5px;font-weight:500}
.key .ct{font:600 17px var(--f-mono);font-variant-numeric:tabular-nums;grid-row:span 2;align-self:center}
.key .pc{font:12px var(--f-mono);color:var(--muted)}
.key.blasty{border-color:var(--eosin);background:var(--eosin-soft)}
.key.excl .pc::after{content:" (not in %)"}
.bar{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.summary-row{display:flex;flex-wrap:wrap;gap:var(--s4);margin-top:var(--s3);font-size:14px}
.summary-row b{font-family:var(--f-mono)}
.ai-drop{border:2px dashed var(--line);border-radius:var(--r);padding:var(--s4);text-align:center;color:var(--muted);background:var(--sunken)}
.ai-drop.over{border-color:var(--accent);color:var(--fg)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:var(--s3)}
.th{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:5px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.th img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;max-width:100%}
.th.low{border-color:var(--warn);background:var(--warn-soft)}
.th select{font-size:12px;padding:2px;border:1px solid var(--line);border-radius:4px;background:var(--sunken)}
.th .cf{font-family:var(--f-mono);color:var(--muted)}
.status{font-size:13px;padding:8px 10px;border-radius:6px;background:var(--sunken);margin-top:var(--s3)}
.status.err{background:var(--warn-soft)}
/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--s5);font:14px/1.55 var(--f-body)}
.report textarea{width:100%;min-height:620px;border:0;background:transparent;font:13.5px/1.6 var(--f-mono);resize:vertical;outline:none}
.dxline{font:600 20px/1.3 var(--f-display);color:var(--accent);margin:0 0 6px}
.catalog-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.catalog-row input{flex:1 1 260px;min-width:0;border:1px solid var(--line);background:var(--sunken);border-radius:6px;padding:7px 9px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:var(--s3) 0}
.tag-ex{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--eosin-soft);color:var(--eosin);border-radius:4px;padding:2px 6px;margin-left:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
@media (max-width:1180px){.layout{grid-template-columns:180px minmax(0,1fr)} aside.live{grid-column:1/-1;position:static;max-height:none}}
@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr);gap:var(--s4)}
  nav.rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.rail button{white-space:nowrap;flex:0 0 auto}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* Writes reviewed cells + labels.csv into a zip and offers it for download. No patient identifiers: the case code is a one-way hash. */

async function verifyCode(text) {

    return Array.from(h.slice(0, 6), b => b.toString(16).padStart(2, "0")).join("").toUpperCase().replace(/(.{4})(?=.)/g, "$1-"); } catch { return "—"; }

async function printReport() {

    <div class="foot">Verification code <b>${code}</b> (SHA-256 of the report text) · Printed ${new Date().toLocaleString("en-GB")}${state.authorised ? "" : " · <b>NOT AUTHORISED — draft for review</b>"}<br>
    AI-assisted analysis is decision support only; this report is valid only when authorised by the reporting pathologist.</div>`;
